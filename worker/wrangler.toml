name = "predictle-leaderboard"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Created with: npx wrangler d1 create predictle-leaderboard
[[d1_databases]]
binding = "DB"
database_name = "predictle-leaderboard"
database_id = "c3b9e867-b731-4cf1-b3ec-e309ceb7b48e"

[vars]
# Browser origins allowed to call this API (comma-separated).
ALLOWED_ORIGINS = "https://biccyanzac-pixel.github.io"
# Where the worker fetches day files to score guesses itself.
PUZZLE_BASE = "https://biccyanzac-pixel.github.io/predictle/puzzles/"
