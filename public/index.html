<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Predictle</title>
  <meta name="description" content="A daily physics prediction game: three contraptions, predict the outcome, watch it play out.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f8f7a'/%3E%3Cpath d='M6 12 L18 17' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='8' r='3.5' fill='%23ffd166'/%3E%3Ccircle cx='23' cy='24' r='3.5' fill='none' stroke='%23fff' stroke-width='2' stroke-dasharray='2 2'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #fbf7f0; --surface: #ffffff; --ink: #14213d; --muted: #55607a; --border: #ddd5c6;
      --accent: #0f8f7a; --accent-ink: #ffffff; --sky: #fffdf8; --letterbox: #efe8db;
      --easy: #1a7f37; --medium: #b58105; --hard: #c2410c;
      --shadow: 0 1px 0 rgba(20,33,61,.05), 0 10px 24px -18px rgba(20,33,61,.4);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1424; --surface: #1a2135; --ink: #f4f1ea; --muted: #b6bed0; --border: #2c3550;
        --accent: #4fd1b5; --accent-ink: #0b1220; --sky: #e9eef6; --letterbox: #0b0f1c;
        --easy: #4cc26b; --medium: #f0c040; --hard: #ff8a4c; --shadow: 0 18px 40px -24px rgba(0,0,0,.8);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f1424; --surface: #1a2135; --ink: #f4f1ea; --muted: #b6bed0; --border: #2c3550;
      --accent: #4fd1b5; --accent-ink: #0b1220; --sky: #e9eef6; --letterbox: #0b0f1c;
      --easy: #4cc26b; --medium: #f0c040; --hard: #ff8a4c; --shadow: 0 18px 40px -24px rgba(0,0,0,.8);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { max-width: 600px; margin: 0 auto; padding: 14px 16px 0; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    header h1 { font: 700 1.6rem/1 Georgia, "Times New Roman", serif; margin: 0; }
    header h1 a { color: inherit; text-decoration: none; }
    #date { color: var(--muted); font-size: .95rem; }
    .legend { max-width: 600px; margin: 8px auto 0; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .85rem; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend canvas { width: 18px; height: 18px; border-radius: 4px; }
    .legend small { opacity: .8; }
    main { max-width: 600px; margin: 0 auto; padding: 10px 16px 40px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
    h2 { font: 700 1.35rem/1.25 Georgia, serif; margin: 0 0 8px; }
    h3 { margin: 0 0 8px; font-size: 1.05rem; }
    .muted { color: var(--muted); }
    .plan { padding-left: 1.3em; }
    button, input, select, output { font: inherit; }
    button {
      min-height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface); color: var(--ink); cursor: pointer; touch-action: manipulation;
    }
    button:disabled { opacity: .45; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
    button.big { min-height: 54px; padding: 0 28px; font-size: 1.1rem; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .puzzle-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
    .step { font-weight: 650; }
    .slot { text-transform: capitalize; font-weight: 650; padding: 2px 10px; border-radius: 999px; border: 1.5px solid currentColor; }
    .slot.easy { color: var(--easy); } .slot.medium { color: var(--medium); } .slot.hard { color: var(--hard); }
    .fmt { color: var(--muted); }
    .question { font-size: 1.1rem; font-weight: 600; margin: 8px 0; min-height: 1.5em; }
    .stage { position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 68vh; margin: 0 auto; }
    canvas.view { width: 100%; height: 100%; display: block; border-radius: 12px; touch-action: none; cursor: crosshair; }
    .slowmo { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(15,143,122,.92); color: #fff; padding: 4px 12px; border-radius: 999px; font-weight: 650; font-size: .85rem; white-space: nowrap; pointer-events: none; }
    .skip { position: absolute; right: 10px; bottom: 10px; min-height: 40px; background: rgba(20,33,61,.82); color: #fff; border: 0; font-weight: 650; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
    .readout { flex: 1 1 140px; color: var(--muted); font-size: .95rem; }
    .stepper { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; }
    .stepper button { width: 52px; font-size: 1.4rem; padding: 0; }
    .count { font-size: 1.6rem; font-weight: 700; min-width: 2.2em; text-align: center; font-variant-numeric: tabular-nums; }
    .slider { display: flex; align-items: center; gap: 10px; flex: 1 1 100%; }
    .slider input { flex: 1; min-height: 40px; accent-color: var(--accent); }
    .stopwatch { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .result { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; margin-top: 10px; }
    .score { font-size: 1.5rem; }
    .big-num { font-size: 2.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .of { color: var(--muted); }
    .scores { list-style: none; padding: 0; margin: 10px 0; }
    .scores li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .share { background: var(--bg); border-radius: 10px; padding: 10px; white-space: pre-wrap; font-size: .95rem; }
    .board input { flex: 1 1 160px; min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); }
    .ranks { list-style: none; padding: 0; margin: 8px 0 0; }
    .ranks li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    .ranks li.you { font-weight: 700; }
    .dev { font-size: .85rem; } .dev a { color: var(--accent); margin-right: 6px; }
    footer { text-align: center; color: var(--muted); font-size: .85rem; padding-bottom: 24px; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <h1><a href="./">Predictle</a></h1>
    <span id="date"></span>
  </header>
  <div class="legend" id="legend" aria-label="Materials"></div>
  <main id="app"><p class="muted">Loading…</p></main>
  <footer>Part of <a href="https://biccyanzac-pixel.github.io/jacob.gg/">jacob.gg</a> daily games</footer>
  <script type="module" src="./js/game.js"></script>
</body>
</html>
