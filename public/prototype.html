<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Predictle prototype</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f8f7a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffd166'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #fbf7f0; --ink: #14213d; --muted: #55607a; --border: #ddd5c6; --surface: #fff;
      --sky: #fffdf8; --letterbox: #efe8db; --accent: #0f8f7a;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1424; --ink: #f4f1ea; --muted: #b6bed0; --border: #2c3550; --surface: #1a2135;
        --sky: #e9eef6; --letterbox: #0b0f1c; --accent: #4fd1b5;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f1424; --ink: #f4f1ea; --muted: #b6bed0; --border: #2c3550; --surface: #1a2135;
      --sky: #e9eef6; --letterbox: #0b0f1c; --accent: #4fd1b5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 12px 16px 32px; }
    h1 { font: 700 1.4rem/1.2 Georgia, serif; margin: 4px 0 8px; }
    .stage { position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 72vh; margin: 0 auto; }
    canvas { width: 100%; height: 100%; display: block; border-radius: 12px; touch-action: none; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
    button, select {
      min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface); color: var(--ink); font: inherit; cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    input[type=range] { flex: 1 1 100%; min-height: 32px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 6px 0 10px; color: var(--muted); font-size: .9rem; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend canvas { width: 22px; height: 22px; border-radius: 4px; }
    .stats { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
    .slowmo { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(15,143,122,.92); color: #fff;
      padding: 4px 12px; border-radius: 999px; font-weight: 600; font-size: .85rem; display: none; white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <h1>Predictle: engine prototype</h1>
    <div class="legend" id="legend" aria-label="Materials"></div>
    <div class="stage">
      <canvas id="view" aria-label="Recorded physics contraption"></canvas>
      <div class="slowmo" id="slowmo">Slow motion: key moment</div>
    </div>
    <div class="controls">
      <button class="primary" id="play">Play</button>
      <button id="restart">Restart</button>
      <button id="key">Slow-mo key moment</button>
      <select id="speed" aria-label="Playback speed">
        <option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option><option value="2">2×</option>
      </select>
      <input type="range" id="scrub" min="0" value="0" step="0.01" aria-label="Scrub">
    </div>
    <div class="stats" id="stats">Loading…</div>
  </main>
  <script type="module">
    import { unpackPuzzle } from "./js/shared/codec.js";
    import { MATERIALS } from "./js/shared/materials.js";
    import { Renderer } from "./js/render.js";

    const $ = (id) => document.getElementById(id);

    async function load(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${url}: ${res.status}`);
      const gz = await res.arrayBuffer();
      const raw = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
      return { ...unpackPuzzle(new Uint8Array(raw)), bytes: gz.byteLength };
    }

    const t0 = performance.now();
    const { meta, motion, bytes } = await load("./puzzles/prototype.prd");
    const loadMs = performance.now() - t0;
    const canvas = $("view");
    const r = new Renderer(canvas, meta, motion);

    // legend swatches use the same patterns as the scene
    for (const [name, m] of Object.entries(MATERIALS)) {
      const span = document.createElement("span");
      const sw = document.createElement("canvas");
      span.append(sw, `${m.label} (${m.note})`);
      $("legend").append(span);
      requestAnimationFrame(() => {
        const dpr = window.devicePixelRatio || 1;
        sw.width = sw.height = Math.round(22 * dpr);
        const g = sw.getContext("2d");
        const lr = new Renderer(sw, { world: { width: 1, height: 1 } }, null);
        lr.ctx = g; lr.scale = sw.width; lr.tile = sw.width / 2.2;
        g.setTransform(sw.width, 0, 0, -sw.width, 0, sw.width);
        lr.drawShape({ t: "box", x: 0.5, y: 0.5, hw: 0.5, hh: 0.5, m: name });
      });
    }

    const last = meta.frameCount - 1;
    $("scrub").max = last;
    let frame = 0, playing = false, speed = 1, prev = null, wall = 0;
    let slowWindow = null; // [from, to] frames played at 0.25x
    let fpsFrames = 0, fpsStart = performance.now(), fps = 0;

    function resize() { r.resize(); r.draw(frame, wall); }
    new ResizeObserver(resize).observe(canvas);

    function tick(now) {
      if (prev !== null && playing) {
        const dt = Math.min(0.1, (now - prev) / 1000);
        const inSlow = slowWindow && frame >= slowWindow[0] && frame <= slowWindow[1];
        $("slowmo").style.display = inSlow ? "block" : "none";
        frame += dt * meta.fps * (inSlow ? 0.25 : speed);
        wall += dt * (inSlow ? 0.25 : speed);
        if (slowWindow && frame > slowWindow[1]) slowWindow = null;
        if (frame >= last) { frame = last; playing = false; $("play").textContent = "Play"; }
        $("scrub").value = frame;
      }
      prev = now;
      r.draw(frame, wall);
      fpsFrames++;
      if (now - fpsStart > 1000) { fps = (fpsFrames * 1000) / (now - fpsStart); fpsFrames = 0; fpsStart = now; showStats(); }
      requestAnimationFrame(tick);
    }

    function showStats() {
      $("stats").textContent = `${meta.bodies.length} moving bodies · ${(meta.frameCount / meta.fps).toFixed(1)} s at ${meta.fps} fps · ` +
        `file ${(bytes / 1024).toFixed(1)} KB gzipped · loaded+decoded in ${loadMs.toFixed(0)} ms · ` +
        `drawing at ${fps.toFixed(0)} fps · key moment ${(meta.keyFrame / meta.fps).toFixed(2)} s`;
    }

    $("play").onclick = () => {
      if (frame >= last) frame = 0, wall = 0;
      playing = !playing;
      $("play").textContent = playing ? "Pause" : "Play";
    };
    $("restart").onclick = () => { frame = 0; wall = 0; slowWindow = null; playing = true; $("play").textContent = "Pause"; };
    $("key").onclick = () => {
      if (meta.keyFrame === null) return;
      frame = Math.max(0, meta.keyFrame - meta.fps); // one second of run-up at normal speed
      slowWindow = [meta.keyFrame - meta.fps * 0.3, meta.keyFrame + meta.fps * 0.5];
      playing = true; $("play").textContent = "Pause";
    };
    $("speed").onchange = (e) => (speed = +e.target.value);
    $("scrub").oninput = (e) => { frame = +e.target.value; playing = false; $("play").textContent = "Play"; };
    showStats();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
